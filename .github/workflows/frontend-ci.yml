name: frontend

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test:unit

  client-portal:
    name: client-portal integration tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/skynexia_ci
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      # High enough for the ~50 sign-ins the suite makes from one address,
      # low enough to keep the rate-limit probe in hardening.test.mjs quick.
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # A production build makes the runner use `next start`, which is both
      # faster and closer to what is deployed than `next dev`.
      - run: pnpm build
      - run: pnpm test:client-portal
